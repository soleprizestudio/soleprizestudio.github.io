site:
  name: SolePrize Studio
  site: 'https://soleprizestudio.github.io'
  base: '/'
  # GitHub Pages serves every page as a directory index and 301s the
  # slash-less form onto it, so the canonical URLs, the sitemap and our own
  # links all have to carry the slash - otherwise we hand Google a sitemap
  # full of redirects whose destinations point back at the redirecting URL.
  trailingSlash: true

# Default SEO metadata
metadata:
  title:
    default: SolePrize Studio
    template: '%s — SolePrize Studio'
  description: '취미로 앱과 게임을 만드는 1인 개발자, SolePrize Studio입니다.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: SolePrize Studio
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website

i18n:
  language: ko
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/posts/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'posts' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-SQHRJDDC9P'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
