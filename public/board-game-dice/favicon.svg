<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#2d6552"/>
      <stop offset="1" stop-color="#0f251e"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ea"/>
      <stop offset="1" stop-color="#e6d8b8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="1" stop-color="#7a2323"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- back die: red, shows 3 -->
  <g transform="rotate(16 338 200)">
    <rect x="236" y="104" width="204" height="204" rx="46" fill="#000" opacity=".4" filter="url(#sh)" transform="translate(6 12)"/>
    <rect x="236" y="98" width="204" height="204" rx="46" fill="url(#red)" stroke="#c9a35a" stroke-width="10"/>
    <g fill="#f6eedb">
      <circle cx="286" cy="148" r="21"/>
      <circle cx="338" cy="200" r="21"/>
      <circle cx="390" cy="252" r="21"/>
    </g>
  </g>

  <!-- front die: ivory, shows 4 -->
  <g transform="rotate(-10 196 318)">
    <rect x="82" y="212" width="228" height="228" rx="52" fill="#000" opacity=".5" filter="url(#sh)" transform="translate(8 14)"/>
    <rect x="82" y="204" width="228" height="228" rx="52" fill="url(#ivory)" stroke="#c9a35a" stroke-width="11"/>
    <g fill="#8a2a2a">
      <circle cx="140" cy="262" r="25"/>
      <circle cx="252" cy="262" r="25"/>
      <circle cx="140" cy="374" r="25"/>
      <circle cx="252" cy="374" r="25"/>
    </g>
  </g>
</svg>
